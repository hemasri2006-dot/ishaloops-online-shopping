<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login | IshaLoops</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

    <style>

        /* =========================
           LOGIN PAGE
        ========================= */

        .login-page {

            min-height: calc(100vh - 75px);

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 40px 20px;

            background:
                linear-gradient(
                    rgba(255, 240, 247, 0.88),
                    rgba(255, 248, 252, 0.94)
                );
        }


        .login-container {

            width: 100%;

            max-width: 950px;

            min-height: 520px;

            display: grid;

            grid-template-columns: 1fr 1fr;

            background: white;

            border-radius: 25px;

            overflow: hidden;

            box-shadow:
                0 15px 45px rgba(120, 55, 80, 0.15);
        }


        /* =========================
           LEFT SIDE
        ========================= */

        .login-welcome {

            background:
                linear-gradient(
                    rgba(190, 66, 108, 0.75),
                    rgba(110, 45, 75, 0.82)
                ),
                url("{{ url_for('static', filename='uploads/comdo.webp') }}");

            background-size: cover;

            background-position: center;

            color: white;

            padding: 50px 40px;

            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: center;

            text-align: center;
        }


        .login-welcome h1 {

            font-family: Georgia, serif;

            font-size: 45px;

            margin-bottom: 15px;
        }


        .login-welcome h2 {

            font-size: 24px;

            margin-bottom: 15px;

            font-weight: 500;
        }


        .login-welcome p {

            max-width: 350px;

            line-height: 1.7;

            font-size: 16px;
        }


        .login-heart {

            font-size: 45px;

            margin-bottom: 15px;
        }


        /* =========================
           RIGHT SIDE
        ========================= */

        .login-box {

            padding: 50px 45px;

            display: flex;

            flex-direction: column;

            justify-content: center;
        }


        .login-box h2 {

            font-family: Georgia, serif;

            text-align: center;

            color: #38252c;

            font-size: 32px;

            margin-bottom: 8px;
        }


        .login-subtitle {

            text-align: center;

            color: #80616d;

            margin-bottom: 30px;

            font-size: 14px;
        }


        .login-form {

            width: 100%;
        }


        .input-group {

            margin-bottom: 20px;
        }


        .input-group label {

            display: block;

            margin-bottom: 8px;

            color: #4d3540;

            font-weight: bold;

            font-size: 14px;
        }


        .input-group input {

            width: 100%;

            padding: 14px 16px;

            border: 1px solid #e2cbd4;

            border-radius: 10px;

            outline: none;

            font-size: 15px;

            background: #fffafd;

            transition: 0.3s;
        }


        .input-group input:focus {

            border-color: #d64c7b;

            box-shadow:
                0 0 0 3px rgba(214, 76, 123, 0.10);
        }


        .login-button {

            width: 100%;

            padding: 14px;

            border: none;

            border-radius: 10px;

            background: #d64c7b;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.3s;

            margin-top: 5px;
        }


        .login-button:hover {

            background: #b93662;

            transform: translateY(-2px);

            box-shadow:
                0 7px 18px rgba(214, 76, 123, 0.25);
        }


        .register-text {

            text-align: center;

            margin-top: 25px;

            color: #80616d;

            font-size: 14px;
        }


        .register-text a {

            color: #d64c7b;

            font-weight: bold;

            text-decoration: none;
        }


        .register-text a:hover {

            text-decoration: underline;
        }


        .back-home {

            display: block;

            text-align: center;

            margin-top: 18px;

            color: #6d5960;

            text-decoration: none;

            font-size: 14px;
        }


        .back-home:hover {

            color: #d64c7b;
        }


        /* =========================
           MOBILE
        ========================= */

        @media (max-width: 700px) {

            .login-page {

                padding: 25px 15px;

                min-height: calc(100vh - 75px);
            }


            .login-container {

                grid-template-columns: 1fr;

                min-height: auto;

                border-radius: 20px;
            }


            .login-welcome {

                min-height: 230px;

                padding: 30px 25px;
            }


            .login-welcome h1 {

                font-size: 35px;
            }


            .login-welcome h2 {

                font-size: 20px;
            }


            .login-welcome p {

                font-size: 14px;
            }


            .login-heart {

                font-size: 35px;

                margin-bottom: 8px;
            }


            .login-box {

                padding: 35px 25px;
            }


            .login-box h2 {

                font-size: 28px;
            }

        }


        @media (max-width: 400px) {

            .login-page {

                padding: 15px 10px;
            }


            .login-welcome {

                min-height: 210px;

                padding: 25px 18px;
            }


            .login-box {

                padding: 30px 18px;
            }


            .login-welcome h1 {

                font-size: 30px;
            }


            .input-group input {

                padding: 13px;
            }

        }

    </style>

</head>


<body>


<!-- =========================
     HEADER
========================= -->

<header>

    <nav>

        <div class="logo">
            IshaLoops
        </div>


        <ul>

            <li>
                <a href="/">
                    Home
                </a>
            </li>

            <li>
                <a href="/products">
                    Products
                </a>
            </li>

            <li>
                <a href="/login">
                    Login
                </a>
            </li>

            <li>
                <a href="/register">
                    Register
                </a>
            </li>

        </ul>

    </nav>

</header>



<!-- =========================
     LOGIN
========================= -->

<main class="login-page">


    <div class="login-container">


        <!-- LEFT -->

        <div class="login-welcome">

            <div class="login-heart">
                🎀
            </div>


            <h1>
                IshaLoops
            </h1>


            <h2>
                Welcome Back!
            </h2>


            <p>
                Sign in to your account and
                continue shopping your favourite
                handmade scrunchies and bows.
            </p>

        </div>



        <!-- RIGHT -->

        <div class="login-box">

            <h2>
                User Login
            </h2>


            <p class="login-subtitle">
                Enter your details to continue
            </p>


            <form
                action="/login"
                method="POST"
                class="login-form"
            >


                <!-- EMAIL -->

                <div class="input-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        autocomplete="email"
                        required
                    >

                </div>



                <!-- PASSWORD -->

                <div class="input-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >

                </div>



                <!-- LOGIN BUTTON -->

                <button
                    type="submit"
                    class="login-button"
                >
                    Login →
                </button>


            </form>



            <!-- REGISTER -->

            <p class="register-text">

                Don't have an account?

                <a href="/register">
                    Create Account
                </a>

            </p>


            <!-- BACK HOME -->

            <a
                href="/"
                class="back-home"
            >
                ← Back to Home
            </a>


        </div>


    </div>


</main>


</body>

</html>
